name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  e2e:
    # The seat test against the fake engine (e2e/seat.e2e.mjs): the real app in
    # Chromium, no mtg-table, no network. playwright-core is deliberately not a
    # dependency, so it is installed here without touching package.json.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright-core@1.56.1
      # Full Chromium, not only the headless shell: the PWA test needs a secure
      # non-loopback origin (--unsafely-treat-insecure-origin-as-secure), which the shell ignores.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          BUILD: '0'
      # The full-game playtest's fast subset (e2e/playtest): whole games through the real UI against
      # the fake engine, a monkey clicking only what the board offers, the invariants checked throughout.
      - run: npm run playtest -- --mode fake --games 3 --seed 1 --out e2e/out/playtest
        env:
          BUILD: '0'
      # The installable site: manifest, icons, the service worker and what it never touches.
      - run: npm run test:pwa
        env:
          BUILD: '0'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/out/
          if-no-files-found: ignore
