name: Deploy to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test --if-present
      - run: npm run build
        env:
          GITHUB_PAGES: '1'
      # The same site with relative asset paths, zipped (index.html at the zip
      # root) for the mtg-table bridge to serve itself (`--lan`, phone play).
      - name: Build relative-base site zip
        run: |
          FORGECOACH_BASE=./ npx vite build --outDir "$RUNNER_TEMP/site-rel" --emptyOutDir
          (cd "$RUNNER_TEMP/site-rel" && zip -qr "$GITHUB_WORKSPACE/dist/forgecoach-site.zip" .)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
