<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0e1014" />
    <meta name="color-scheme" content="dark" />
    <!-- Add to Home Screen: full-screen, dark status bar. Relative paths so the
         same build works on github.io/ForgeCoach/ and served at / by the engine. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ForgeCoach" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <!-- iOS: life totals and counts are not phone numbers -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="A practice table for Magic: The Gathering. Play a bot or a friend with a coach beside the board, then look back at what happened." />
    <title>ForgeCoach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600;1,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- The cube section and ledger pages' fonts (forge-theme.css, ledger.css): here, not as a CSS
         @import, so a font server that can't be reached never fails a lazy page's stylesheet. -->
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- The Stack and Hot Felt skins' fonts (skins.css). Each skin names system fallbacks, so a page
         whose fonts never arrive still renders. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&family=Alegreya+Sans+SC:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://api.scryfall.com" crossorigin />
    <link rel="preconnect" href="https://cards.scryfall.io" />
    <link rel="preconnect" href="https://svgs.scryfall.io" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230e1014'/%3E%3Cpath d='M3 9h13l2-3h3v3l-3 2v2H8l-1 2h4v3H5v-3l1-2-3-1z' fill='%23e3b25f'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
