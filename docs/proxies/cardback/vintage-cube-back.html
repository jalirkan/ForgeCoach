<!-- The Vintage Cube proxies' card back. 2.72 x 3.70 in: a poker card (2.5 x 3.5) plus MPC's 1/8 in bleed.
     Rendered at 600 dpi by render.sh. Everything that matters sits inside the cut line with margin. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#0e1014}
svg{display:block;width:816px;height:1110px}
</style></head><body>
<svg viewBox="0 0 816 1110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1f2530"/>
      <stop offset="0.6" stop-color="#12161d"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d08a"/>
      <stop offset="0.5" stop-color="#e3b25f"/>
      <stop offset="1" stop-color="#a87a32"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e3b25f" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="816" height="1110" fill="url(#bg)"/>
  <rect width="816" height="1110" fill="url(#grid)"/>
  <!-- frames, inside the cut line (37.5 px of bleed each side) -->
  <rect x="70" y="70" width="676" height="970" rx="26" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <rect x="86" y="86" width="644" height="938" rx="18" fill="none" stroke="#e3b25f" stroke-opacity="0.45" stroke-width="2"/>
  <!-- corner diamonds -->
  <g fill="url(#gold)">
    <path d="M86 112l12-12 12 12-12 12z" transform="translate(-12 -12)"/>
    <path d="M730 112l12-12 12 12-12 12z" transform="translate(-36 -12)"/>
    <path d="M86 998l12-12 12 12-12 12z" transform="translate(-12 12)"/>
    <path d="M730 998l12-12 12 12-12 12z" transform="translate(-36 12)"/>
  </g>
  <!-- an isometric cube: three faces, gold on ink -->
  <g transform="translate(408 470)">
    <circle r="232" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <circle r="219" fill="#0e1014" fill-opacity="0.55" stroke="#e3b25f" stroke-opacity="0.35" stroke-width="2"/>
    <g stroke="#0e1014" stroke-width="6" stroke-linejoin="round">
      <path d="M0 -150 L130 -75 L0 0 L-130 -75 Z" fill="#f3d08a"/>
      <path d="M-130 -75 L0 0 L0 150 L-130 75 Z" fill="#c8913f"/>
      <path d="M130 -75 L0 0 L0 150 L130 75 Z" fill="#9a6c2a"/>
    </g>
    <path d="M0 -150 L130 -75 L130 75 L0 150 L-130 75 L-130 -75 Z" fill="none" stroke="url(#gold)" stroke-width="3"/>
  </g>
  <g font-family="'DejaVu Serif','Liberation Serif',serif" fill="url(#gold)" text-anchor="middle">
    <text x="408" y="790" font-size="78" font-weight="bold" letter-spacing="14">VINTAGE</text>
    <text x="408" y="868" font-size="52" letter-spacing="30">CUBE</text>
    <line x1="268" y1="902" x2="548" y2="902" stroke="#e3b25f" stroke-opacity="0.6" stroke-width="2"/>
    <text x="408" y="958" font-size="22" letter-spacing="7" fill="#e3b25f" fill-opacity="0.75">PROXY · NOT FOR SALE</text>
  </g>
  <text x="408" y="188" font-family="'DejaVu Serif','Liberation Serif',serif" font-size="24" letter-spacing="9" text-anchor="middle" fill="#e3b25f" fill-opacity="0.7">PLAYTEST CARD</text>
</svg>
</body></html>
